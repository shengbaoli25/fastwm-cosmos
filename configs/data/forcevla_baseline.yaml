train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs: [./data/forcevla_fastwam/wipe]
  shape_meta:
    images:
      - {key: image, raw_shape: [3, 480, 640], shape: [3, 224, 224]}
    action:
      - {key: default, raw_shape: 7, shape: 7}
    state:
      - {key: default, raw_shape: 7, shape: 7}
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 224]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ./data/forcevla_fastwam/shared_stats/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 7
    # Official LIBERO release has an 8D proprio projection. Keep its complete
    # weights: normalize the original seven fields, then append one zero pad.
    proprio_output_dim: 8
    # ForceVLA targets are absolute pose + gripper, not Libero delta commands.
    delta_action_dim_mask: {default: [false, false, false, false, false, false, false]}
    action_state_transforms: null
    use_stepwise_action_norm: false
    # Official supported RoboTwin z-score recipe, matching the current runs.
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      state_target_dim: 8
    train_transforms:
      - {_target_: fastwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [224, 224]}
    val_transforms:
      - {_target_: fastwam.datasets.lerobot.transforms.image.ToTensor}
      - {_target_: torchvision.transforms.Resize, size: [224, 224]}
  text_embedding_cache_dir: ./data/text_embeds_cache/forcevla
  use_text_embed_cache: true
  context_len: 128
