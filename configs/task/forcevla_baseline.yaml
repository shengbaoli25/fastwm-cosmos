# @package _global_
defaults:
  - override /data: forcevla_baseline
  - override /model: fastwam_baseline
  - _self_

# Released Libero uncond recipe, effective batch16 on one H200.
batch_size: 1
num_workers: 4
gradient_accumulation_steps: 16
lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 10
max_steps: 2176
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 1.0e-2
log_every: 1
save_every: 0
# The separately frozen 5-episode training-fit evaluator runs after training.
eval_every: 0
eval_num_inference_steps: 16
resume: null
